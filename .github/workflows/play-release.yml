name: Play Store Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console track to publish to"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/upload-key.jks"

      - name: Decode Play service account key
        run: echo "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 -d > "${{ runner.temp }}/play-service-account.json"

      - name: Publish release bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/play-service-account.json
          PLAY_TRACK: ${{ inputs.track }}
        run: ./gradlew publishReleaseBundle
